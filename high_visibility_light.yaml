# 고대비 시인성 테마 (라이트) — README.md 실제 규격에 맞춰 작성
# 설계 기준(WCAG 명암비):
#   app-text-primary vs app-bg-main   : 약 17.9:1 (AAA)
#   app-text-muted   vs app-bg-main   : 약  7.6:1 (AAA)
#   흰 글씨 vs app-accent 배경         : 약  6.7:1 (AA 상회)
#   app-border       vs app-bg-card   : 약  4.8:1 (UI 비텍스트 요소 기준)
id: high_visibility_light
label: "🔆 고대비 시인성 (라이트)"
vars:
  app-bg-main: "#ffffff"
  app-bg-sidebar: "#eef1f5"
  app-bg-card: "#ffffff"
  app-bg-card-hover: "#e6eaf0"
  app-text-primary: "#0f172a"
  app-text-muted: "#4b5563"
  app-text-secondary: "#1e293b"
  app-accent: "#1d4ed8"
  app-accent-hover: "#1e40af"
  app-accent-contrast: "#ffffff"
  app-border: "#64748b"
  app-border-light: "#cbd5e1"
  app-input-bg: "#ffffff"
  app-panel-rgb: "255, 255, 255"
  app-panel-border-rgb: "15, 23, 42"
