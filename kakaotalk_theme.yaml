# BookOasis 테마 미리보기 & 선택기 플러그인용 샘플 테마 파일
# 사용법: "+ 새 테마 만들기" 탭 > "YAML 파일 업로드" 버튼으로 이 파일을 올리세요.
# 이 파서는 "key: value" 줄만 인식하며, 주석은 반드시 줄 전체가 #으로
# 시작해야 합니다 (값 뒤에 같은 줄로 주석을 붙이면 값이 깨집니다).

name: 카카오톡 스타일

# 배경
# bg-main: 카카오톡 채팅방 배경 특유의 옅은 하늘색
# bg-sidebar: 친구 목록 사이드바는 흰색 기반
# bg-card-hover: 옅은 카카오 옐로우 톤 호버
bg-main: "#b2c7da"
bg-sidebar: "#ffffff"
bg-card: "#ffffff"
bg-card-hover: "#fff6cf"

# 텍스트
# text-primary: 카카오톡 기본 텍스트는 거의 검정에 가까움
# text-secondary: 카카오프렌즈 브라운 톤 (보조 강조용)
text-primary: "#191919"
text-muted: "#7c7c7c"
text-secondary: "#3c1e1e"

# 강조색 (카카오 옐로우)
# 참고: 강조색을 버튼 배경 등으로 쓰면서 흰색 글자를 얹는 화면이 있다면
# 노란색 위 흰 글자는 대비가 약할 수 있습니다. 실제 적용 후 확인해보고,
# 필요하면 accent만 "#3c1e1e"(브라운)처럼 더 어두운 값으로 바꿔보세요.
accent: "#fee500"
accent-hover: "#f6c000"

# 테두리 / 입력창
border: "#e5e5e5"
border-light: "#f0f0f0"
input-bg: "#f5f5f5"
