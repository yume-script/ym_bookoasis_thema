# BookOasis 테마 미리보기 & 선택기 플러그인용 샘플 테마 파일
# 사용법: "+ 새 테마 만들기" 탭 > "YAML 파일 업로드" 버튼으로 이 파일을 올리세요.
# 이 파서는 "key: value" 줄만 인식하며, 주석은 반드시 줄 전체가 #으로
# 시작해야 합니다 (값 뒤에 같은 줄로 주석을 붙이면 값이 깨집니다).
#
# 참고: 이 값들은 플러그인 내장 "엑셀 스타일" 프리셋 버튼과 동일합니다.
# (처음에는 사이드바도 진한 초록으로 만들었다가, 선택 안 된 메뉴 텍스트가
#  거의 안 보이는 문제가 있어서 사이드바도 밝은 톤으로 통일했습니다.)

name: 엑셀 스타일

# 배경 - 시트/리본 모두 밝은 톤으로 통일 (대비 확보 목적)
# bg-sidebar: 오피스 리본 UI 톤의 옅은 회색
# bg-card-hover: 옅은 초록 톤 호버 (선택 셀 느낌)
bg-main: "#ffffff"
bg-sidebar: "#f3f2f1"
bg-card: "#ffffff"
bg-card-hover: "#e8f2ec"

# 텍스트
# text-secondary: 엑셀 그린
text-primary: "#1e1e1e"
text-muted: "#616161"
text-secondary: "#217346"

# 강조색 (엑셀 그린)
accent: "#217346"
accent-hover: "#185c37"

# 테두리 / 입력창 - 셀 그리드 라인 느낌
border: "#d0d7de"
border-light: "#e8eaed"
input-bg: "#f3f2f1"
