# BookOasis 테마 미리보기 & 선택기 플러그인용 샘플 테마 파일
# 사용법: "+ 새 테마 만들기" 탭 > "YAML 파일 업로드" 버튼으로 이 파일을 올리세요.
# 이 파서는 "key: value" 줄만 인식하며, 주석은 반드시 줄 전체가 #으로
# 시작해야 합니다 (값 뒤에 같은 줄로 주석을 붙이면 값이 깨집니다).

name: 디스코드 스타일

# 배경
# bg-main: 채팅창 메인 배경 (디스코드 다크 테마 기준)
# bg-sidebar: 서버 목록 사이드바 (가장 어두운 톤)
# bg-card: 채널 목록 등 보조 패널
# bg-card-hover: 카드/채널 호버 시
bg-main: "#313338"
bg-sidebar: "#1e1f22"
bg-card: "#2b2d31"
bg-card-hover: "#35373c"

# 텍스트
# text-primary: 기본 텍스트 (거의 흰색)
# text-muted: 보조/비활성 텍스트
# text-secondary: 강조 보조 텍스트
text-primary: "#f2f3f5"
text-muted: "#949ba4"
text-secondary: "#b5bac1"

# 강조색 (디스코드 블러플)
accent: "#5865f2"
accent-hover: "#4752c4"

# 테두리 / 입력창
border: "#1e1f22"
border-light: "#26282c"
input-bg: "#383a40"
