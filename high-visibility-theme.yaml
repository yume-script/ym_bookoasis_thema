# BookOasis 커스텀 테마 — theme_previewer 플러그인의 "YAML/JSON 파일 업로드"로
# 바로 불러올 수 있는 형식입니다 (key: "#hex" 줄만 인식).
#
# 서버의 themes/ 폴더에 정식 등록하려면, 이 파일을 넣기 전에 반드시
# themes/README.md 의 정확한 필드명/형식과 대조해 확인하세요.
# (name/author/colors 구조는 CSS 변수 이름을 근거로 한 추정치입니다.)
#
# 설계 기준: WCAG 명암비(Contrast Ratio) 계산
#   - 본문 텍스트(app-text-primary) vs 메인 배경   : 약 18.0:1  (AAA, 기준 7:1)
#   - 보조 텍스트(app-text-muted)   vs 메인 배경   : 약 10.7:1 (AAA)
#   - 흰 글씨 버튼 vs 강조색(app-accent) 배경       : 약  4.6:1  (AA, 기준 4.5:1)
#   - 테두리(app-border) vs 카드 배경               : 약  3.5:1  (UI 비텍스트 요소 기준 3:1)
name: "고대비 시인성 테마 (High Visibility)"
author: "me"
colors:
  app-bg-main: "#0a0e14"
  app-bg-sidebar: "#10151d"
  app-bg-card: "#171d27"
  app-bg-card-hover: "#1f2733"
  app-text-primary: "#f5f7fa"
  app-text-muted: "#b8c2cc"
  app-text-secondary: "#d7dee5"
  app-accent: "#1f6feb"
  app-accent-hover: "#388bfd"
  app-border: "#6b7280"
  app-border-light: "#3a4048"
  app-input-bg: "#10151d"
