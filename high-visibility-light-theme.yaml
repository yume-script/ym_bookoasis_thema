# BookOasis 커스텀 테마 — theme_previewer 플러그인의 "YAML/JSON 파일 업로드"로
# 바로 불러올 수 있는 형식입니다 (key: "#hex" 줄만 인식).
#
# 서버의 themes/ 폴더에 정식 등록하려면, 이 파일을 넣기 전에 반드시
# themes/README.md 의 정확한 필드명/형식과 대조해 확인하세요.
# (name/author/colors 구조는 CSS 변수 이름을 근거로 한 추정치입니다.)
#
# 설계 기준: WCAG 명암비(Contrast Ratio) 계산 — 화이트 계열
#   - 본문 텍스트(app-text-primary) vs 메인 배경   : 약 17.9:1 (AAA, 기준 7:1)
#   - 보조 텍스트(app-text-muted)   vs 메인 배경   : 약  7.6:1 (AAA)
#   - 흰 글씨 버튼 vs 강조색(app-accent) 배경       : 약  6.7:1 (AA 상회, AAA 7:1에 근접)
#   - 테두리(app-border) vs 카드 배경               : 약  4.8:1 (흰 배경에서 잘 보이도록 진하게 설정)
name: "고대비 시인성 테마 (High Visibility Light)"
author: "me"
colors:
  app-bg-main: "#ffffff"
  app-bg-sidebar: "#eef1f5"
  app-bg-card: "#ffffff"
  app-bg-card-hover: "#e6eaf0"
  app-text-primary: "#0f172a"
  app-text-muted: "#4b5563"
  app-text-secondary: "#1e293b"
  app-accent: "#1d4ed8"
  app-accent-hover: "#1e40af"
  app-border: "#64748b"
  app-border-light: "#cbd5e1"
  app-input-bg: "#ffffff"
